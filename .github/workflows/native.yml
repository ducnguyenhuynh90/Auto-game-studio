name: Native apps (Android + iOS)
# Builds the Capacitor apps from the same game build (docs/NATIVE.md).
# Android: a debug APK to sideload on any phone, plus a signed release AAB for Google Play when the
# upload-key secrets exist. iOS: a simulator build that proves the project compiles; App Store builds
# need the founder's Apple Developer account (see docs/NATIVE.md).
on:
  push:
    paths: ['src/**', 'android/**', 'ios/**', 'capacitor.config.ts', 'package*.json', 'public/**', '.github/workflows/native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
env:
  # player accounts + cloud saves (docs/TECHNICAL.md); empty = guest-only app
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  # Google Analytics 4 (docs/ANALYTICS.md); empty = no GA
  VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the test APK to the "android-latest" release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Upload key (only when the secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build APK + AAB
        working-directory: android
        env:
          MAM_VERSION_CODE: ${{ github.run_number }}
          MAM_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: mam-village-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      # A direct download link for phones: the release "android-latest" always holds the newest test APK
      # from the default branch (https://github.com/<repo>/releases/download/android-latest/mam-village.apk).
      - name: Publish the test APK for phones
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mam-village.apk
          cloud=$([ -n "$VITE_SUPABASE_URL" ] && echo "on (Supabase)" || echo "off (guest only)")
          ga=$([ -n "$VITE_GA_MEASUREMENT_ID" ] && echo "on (opt-in)" || echo "off")
          notes="Test build 1.0.${{ github.run_number }} ($(git log -1 --format=%s | cut -c1-80)). Cloud saves + sign-in: $cloud. Analytics: $ga. Open on an Android phone, download mam-village.apk, allow installs from this source, install. New versions install over the old one and keep your save."
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --prerelease --title "Android test build (latest)" --notes "$notes"
          gh release edit android-latest --notes "$notes"
          gh release upload android-latest mam-village.apk --clobber

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for the iOS simulator (no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build
      - run: cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/MamVillage-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: mam-village-ios-simulator-${{ github.run_number }}
          path: MamVillage-simulator.zip
