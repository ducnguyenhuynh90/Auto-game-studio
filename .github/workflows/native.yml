name: Native apps (Android + iOS)
# Builds the mobile app (mobile/android + mobile/ios, Capacitor) from the same game build (docs/NATIVE.md).
# Android: a debug APK to sideload on any phone, plus a signed release AAB for Google Play when the
# upload-key secrets exist. iOS: a simulator build that proves the project compiles, and on request
# (Run workflow → testflight) a signed archive uploaded to TestFlight (docs/STORE_RELEASE.md).
on:
  push:
    paths: ['src/**', 'mobile/**', 'capacitor.config.ts', 'package*.json', 'public/**', '.github/workflows/native.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Also archive the iOS app and upload it to TestFlight (needs the App Store Connect secrets)'
        type: boolean
      play_track:
        description: 'Also upload the signed Android bundle to Google Play (needs the upload key + Play service account secrets; the first upload must be done by hand)'
        type: choice
        options: [none, internal, alpha, beta, production]
        default: none
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
env:
  # player accounts + cloud saves (docs/TECHNICAL.md); empty = guest-only app
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  # Google Analytics 4 (docs/ANALYTICS.md); empty = no GA
  VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the test APK to the "android-latest" release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Upload key (only when the secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build APK + AAB
        working-directory: mobile/android
        env:
          MAM_VERSION_CODE: ${{ github.run_number }}
          MAM_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: mam-village-android-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      # A direct download link for phones: the release "android-latest" always holds the newest test APK
      # from the default branch (https://github.com/<repo>/releases/download/android-latest/mam-village.apk).
      - name: Publish the test APK for phones
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mam-village.apk
          cloud=$([ -n "$VITE_SUPABASE_URL" ] && echo "on (Supabase)" || echo "off (guest only)")
          ga=$([ -n "$VITE_GA_MEASUREMENT_ID" ] && echo "on (opt-in)" || echo "off")
          notes="Test build 1.0.${{ github.run_number }} ($(git log -1 --format=%s | cut -c1-80)). Cloud saves + sign-in: $cloud. Analytics: $ga. Open on an Android phone, download mam-village.apk, allow installs from this source, install. New versions install over the old one and keep your save."
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --prerelease --title "Android test build (latest)" --notes "$notes"
          gh release edit android-latest --notes "$notes"
          gh release upload android-latest mam-village.apk --clobber

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for the iOS simulator (no signing)
        run: |
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build
      - run: cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/MamVillage-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: mam-village-ios-simulator-${{ github.run_number }}
          path: MamVillage-simulator.zip

  # App Store: archive, sign and upload to TestFlight, on request (Actions → Run workflow → testflight).
  # Signing is cloud-managed by Xcode with an App Store Connect API key, so no certificates or profiles
  # live in the repository. Needs the team's Apple Developer account (docs/STORE_RELEASE.md).
  ios-testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-latest
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - name: Check the App Store secrets
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v (docs/STORE_RELEASE.md)"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Archive, sign and upload to TestFlight
        run: |
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          mkdir -p build
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath build/MamVillage.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} "${AUTH[@]}" archive
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/MamVillage.xcarchive -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export "${AUTH[@]}"

  # Google Play: upload the signed .aab built by the android job, on request (Run workflow → play_track).
  # Needs ANDROID_KEYSTORE_* (signing) and PLAY_SERVICE_ACCOUNT_JSON (Play Console → Users and permissions →
  # invite a Google Cloud service account with "Release apps"). Google requires the first upload by hand.
  play-upload:
    needs: android
    if: github.event_name == 'workflow_dispatch' && inputs.play_track != 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 is missing: the bundle would be unsigned (docs/STORE_RELEASE.md)"; exit 1; }
          [ -n "$PLAY_JSON" ] || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON is missing (docs/STORE_RELEASE.md)"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: mam-village-android-${{ github.run_number }}
          path: out
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mamvillage.app
          releaseFiles: out/bundle/release/app-release.aab
          track: ${{ inputs.play_track }}
          status: ${{ inputs.play_track == 'internal' && 'completed' || 'draft' }}
