name: Deploy playable build to GitHub Pages
on:
  push:
    # the repository's default branch: GitHub Pages only accepts deploys from it
    branches: [ccr-833d8974-lkhlcm]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # one deploy at a time per branch: a push to both branches must not cancel the one that may deploy
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # player accounts + cloud saves (see docs/TECHNICAL.md); empty = guest-only build
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Google Analytics 4 (docs/ANALYTICS.md); empty = no GA
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
