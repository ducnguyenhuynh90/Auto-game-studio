name: React Native app (mobile/)
# The React Native version of the game (Expo SDK 58, React Native 0.88). The rules are the web game's
# src/core, shared through Metro, so a change to either triggers this. Native projects are generated
# fresh on every run (expo prebuild): nothing generated is committed. docs/REACT_NATIVE.md.
on:
  push:
    paths: ['mobile/**', 'src/core/**', 'src/auth/**', 'src/analytics/**', 'src/render/audio.ts', 'src/render/ambience.ts', '.github/workflows/react-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rn-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: mobile
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # the same JS the phones run, bundled with Hermes for both platforms
      - run: npx expo export --platform android --platform ios --output-dir dist-check

  # the app played like a person in Chromium (React Native Web + Skia/CanvasKit): the core loop and the
  # island business (tools/web-e2e*.mjs). Rules under test are the shared src/core.
  play:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm run web:setup && npx expo export --platform web --output-dir /tmp/rn-web
      - name: Play the core loop and the island business
        run: |
          (cd /tmp/rn-web && python3 -m http.server 4181 >/dev/null 2>&1 &)
          sleep 2
          node tools/web-e2e.mjs http://localhost:4181/ shots
          node tools/web-e2e-business.mjs http://localhost:4181/ shots
      # cloud backup + Google Analytics, against fake servers (no keys needed)
      - name: Play the optional services (fake Supabase and GA)
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://fake.supabase.test
          EXPO_PUBLIC_SUPABASE_ANON_KEY: anon
          EXPO_PUBLIC_GA_MEASUREMENT_ID: G-TEST
          EXPO_PUBLIC_GA_API_SECRET: secret
        run: |
          npx expo export --platform web --output-dir /tmp/rn-web-svc
          (cd /tmp/rn-web-svc && python3 -m http.server 4182 >/dev/null 2>&1 &)
          sleep 2
          node tools/web-e2e-services.mjs http://localhost:4182/ shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rn-play-screenshots-${{ github.run_number }}
          path: mobile/shots

  android:
    needs: check
    runs-on: ubuntu-latest
    # the services turn on when the repository has these secrets (docs/REACT_NATIVE.md); unset = off
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      EXPO_PUBLIC_GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build release APK (debug-signed, installable on any phone)
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: mam-village-rn-android-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  ios:
    needs: check
    runs-on: macos-latest
    # the services turn on when the repository has these secrets (docs/REACT_NATIVE.md); unset = off
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      EXPO_PUBLIC_GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Build for the iOS simulator (no signing)
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          # the app's scheme is named after its workspace (the first listed scheme can be a library pod)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace $WS scheme $SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Release-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/MamVillage-RN-simulator.zip" *.app
      - uses: actions/upload-artifact@v4
        with:
          name: mam-village-rn-ios-simulator-${{ github.run_number }}
          path: MamVillage-RN-simulator.zip
