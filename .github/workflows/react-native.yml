name: React Native app (archived)
# ARCHIVED (D-030): the React Native version of the game (Expo SDK 58, React Native 0.88), kept in
# archive/react-native/. The shipping mobile app is mobile/ (Capacitor). Runs only when started by hand.
# The rules are the web game's
# src/core, shared through Metro, so a change to either triggers this. Native projects are generated
# fresh on every run (expo prebuild): nothing generated is committed. docs/REACT_NATIVE.md.
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Also archive the iOS app and upload it to TestFlight (needs the App Store Connect secrets)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: rn-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: archive/react-native
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: archive/react-native/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # the same JS the phones run, bundled with Hermes for both platforms
      - run: npx expo export --platform android --platform ios --output-dir dist-check

  # the app played like a person in Chromium (React Native Web + Skia/CanvasKit): the core loop and the
  # island business (tools/web-e2e*.mjs). Rules under test are the shared src/core.
  play:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: archive/react-native/package-lock.json
      - run: npm ci
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm run web:setup && npx expo export --platform web --output-dir /tmp/rn-web
      - name: Play the core loop and the island business
        run: |
          (cd /tmp/rn-web && python3 -m http.server 4181 >/dev/null 2>&1 &)
          sleep 2
          node tools/web-e2e.mjs http://localhost:4181/ shots
          node tools/web-e2e-business.mjs http://localhost:4181/ shots
          node tools/web-e2e-sort.mjs http://localhost:4181/ shots
      # cloud backup + Google Analytics, against fake servers (no keys needed)
      - name: Play the optional services (fake Supabase and GA)
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://fake.supabase.test
          EXPO_PUBLIC_SUPABASE_ANON_KEY: anon
          EXPO_PUBLIC_GA_MEASUREMENT_ID: G-TEST
          EXPO_PUBLIC_GA_API_SECRET: secret
        run: |
          npx expo export --platform web --output-dir /tmp/rn-web-svc
          (cd /tmp/rn-web-svc && python3 -m http.server 4182 >/dev/null 2>&1 &)
          sleep 2
          node tools/web-e2e-services.mjs http://localhost:4182/ shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rn-play-screenshots-${{ github.run_number }}
          path: archive/react-native/shots

  android:
    needs: check
    runs-on: ubuntu-latest
    # the services turn on when the repository has these secrets (docs/REACT_NATIVE.md); unset = off
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      EXPO_PUBLIC_GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
      # the store app id, once the founder picks it (docs/STORE_RELEASE.md); unset = com.mamvillage.rn
      MAM_APP_ID: ${{ vars.MAM_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: archive/react-native/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Upload key (only when the secrets are set; plugins/withReleaseSigning.js)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - run: npx expo prebuild --platform android --no-install
        env:
          MAM_VERSION_CODE: ${{ github.run_number }}
          MAM_VERSION_NAME: 1.0.${{ github.run_number }}
      # APK to install on any phone; with the upload key also the AAB for Google Play. Without the key
      # both are signed with the debug key (fine for testers, refused by Play).
      - name: Build release APK (+ AAB for Google Play when signed)
        working-directory: archive/react-native/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease ${ANDROID_KEYSTORE_PATH:+bundleRelease}
      - name: Show which key signed the APK
        run: keytool -printcert -jarfile archive/react-native/android/app/build/outputs/apk/release/app-release.apk | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: mam-village-rn-android-${{ github.run_number }}
          path: |
            archive/react-native/android/app/build/outputs/apk/release/app-release.apk
            archive/react-native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    needs: check
    runs-on: macos-latest
    # the services turn on when the repository has these secrets (docs/REACT_NATIVE.md); unset = off
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      EXPO_PUBLIC_GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
      # the store app id, once the founder picks it (docs/STORE_RELEASE.md); unset = com.mamvillage.rn
      MAM_APP_ID: ${{ vars.MAM_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: archive/react-native/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Build for the iOS simulator (no signing)
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          # the app's scheme is named after its workspace (the first listed scheme can be a library pod)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace $WS scheme $SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Release-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/MamVillage-RN-simulator.zip" *.app
      - uses: actions/upload-artifact@v4
        with:
          name: mam-village-rn-ios-simulator-${{ github.run_number }}
          path: MamVillage-RN-simulator.zip

  # App Store: archive, sign and upload to TestFlight, on request (Actions → Run workflow → testflight).
  # Signing is cloud-managed by Xcode with an App Store Connect API key, so no certificates or profiles
  # live in the repository. Needs the founder's Apple Developer account (docs/STORE_RELEASE.md).
  ios-testflight:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      EXPO_PUBLIC_GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
      # the store app id, once the founder picks it (docs/STORE_RELEASE.md); unset = com.mamvillage.rn
      MAM_APP_ID: ${{ vars.MAM_APP_ID }}
      MAM_VERSION_CODE: ${{ github.run_number }}
      MAM_VERSION_NAME: 1.0.${{ github.run_number }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - name: Check the App Store secrets
        working-directory: .
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v (docs/STORE_RELEASE.md)"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: archive/react-native/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Archive, sign and upload to TestFlight
        run: |
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath build/MamVillage.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic "${AUTH[@]}" archive
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/MamVillage.xcarchive -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export "${AUTH[@]}"
