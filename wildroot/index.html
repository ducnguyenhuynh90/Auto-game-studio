<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WILDROOT Ao Ếch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<style>
/* Layout: full-screen 3D diorama; thin HUD on top, card tray at the bottom, sheets slide up over it.
   Deliberately one look (a sunny toy diorama), so no dark palette: every colour is set explicitly. */
:root {
  --sky: #cfe9df;
  --panel: rgb(255 255 255 / 0.9);
  --ink: #183028;
  --muted: #5d7068;
  --line: rgb(24 48 40 / 0.12);
  --a: #0f8a76;
  --b: #d9730d;
  --good: #2e9b3a;
  --bad: #d23b2f;
  --gold: #f5b800;
  --focus: #1060c9;
  --font-display: 'Bricolage Grotesque', 'Be Vietnam Pro', system-ui, sans-serif;
  --font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --shadow: 0 6px 18px rgb(20 50 40 / 0.18), 0 1px 3px rgb(20 50 40 / 0.12);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font: 600 14px/1.35 var(--font-body); overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud { position: fixed; inset: 0; pointer-events: none; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.hud > * { pointer-events: auto; }

/* top bar */
.top { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; align-items: center; pointer-events: none; }
.top > * { pointer-events: auto; }
.pill { background: var(--panel); border-radius: 999px; box-shadow: var(--shadow); height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; }
.level { font-family: var(--font-display); font-weight: 800; font-size: 16px; }
.level small { font: 700 12px var(--font-body); color: var(--muted); }
.goalbar { display: flex; gap: 6px; font-size: 14px; }
.goalbar span { display: inline-flex; gap: 2px; align-items: center; font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
.round { width: 44px; padding: 0; justify-content: center; font-size: 20px; position: relative; }
.badge { position: absolute; top: -4px; right: -4px; background: var(--bad); color: #fff; font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; }

/* island tags (positioned from the 3D projection) */
.tag { position: absolute; transform: translate(-50%, -100%); display: flex; gap: 6px; align-items: center; background: var(--panel); border-radius: 999px; padding: 4px 8px 4px 4px; box-shadow: var(--shadow); white-space: nowrap; }
.tag .id { width: 28px; height: 28px; border-radius: 50%; color: #fff; display: grid; place-items: center; font: 800 15px var(--font-display); }
.tag[data-w="0"] .id { background: var(--a); } .tag[data-w="1"] .id { background: var(--b); }
.pips { display: flex; gap: 3px; }
.pips i { width: 10px; height: 10px; border-radius: 50%; background: #79c47a; box-shadow: inset 0 -2px 0 rgb(0 0 0 / 0.15); }
.pips i.used { background: #d5ddd9; box-shadow: none; }
.applied { display: flex; gap: 2px; }
.applied button { width: 30px; height: 30px; border-radius: 50%; background: #fff; font-size: 17px; display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--line); }
.applied button:hover { box-shadow: inset 0 0 0 2px var(--bad); }
.chips { position: absolute; transform: translate(-50%, 0); display: flex; gap: 5px; }
.chip { background: var(--panel); border-radius: 12px; padding: 4px 7px; box-shadow: var(--shadow); display: grid; justify-items: center; min-width: 44px; font-variant-numeric: tabular-nums; position: relative; }
.chip .ic { font-size: 18px; line-height: 1.1; }
.chip .v { font-size: 12.5px; font-weight: 800; }
.chip.ok { box-shadow: inset 0 0 0 2.5px var(--good), var(--shadow); }
.chip.no { box-shadow: inset 0 0 0 2.5px var(--bad), var(--shadow); }
.chip.ok::after, .chip.no::after { position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; color: #fff; font-size: 10px; display: grid; place-items: center; }
.chip.ok::after { content: '✓'; background: var(--good); } .chip.no::after { content: '✕'; background: var(--bad); }
.drop { position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); box-shadow: 0 0 0 4px rgb(255 255 255 / 0.9), 0 0 0 9px rgb(15 138 118 / 0.35); width: 70px; height: 70px; opacity: 0; transition: opacity 0.15s; }
.drop.on { opacity: 1; }

/* bottom: card tray / timeline */
.bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; justify-items: center; pointer-events: none; }
.bottom > * { pointer-events: auto; }
.hint { background: var(--ink); color: #fff; border-radius: 999px; padding: 8px 14px; font-size: 14px; box-shadow: var(--shadow); max-width: 100%; text-align: center; }
.tray { display: flex; gap: 8px; align-items: flex-end; width: 100%; justify-content: center; }
.cards { min-width: 0; flex: 0 1 auto; }
.cards { display: flex; gap: 8px; overflow-x: auto; padding: 10px 4px 4px; scrollbar-width: none; }
.cards::-webkit-scrollbar { display: none; }
.card { flex: 0 0 auto; width: 74px; height: 96px; border-radius: 14px; background: #fff; box-shadow: var(--shadow); display: grid; grid-template-rows: 1fr auto auto; justify-items: center; padding: 8px 4px 6px; transition: transform 0.15s; touch-action: none; }
.card .ic { font-size: 32px; line-height: 1; align-self: center; }
.card .nm { font-size: 11.5px; line-height: 1.15; text-align: center; }
.card .cost { display: flex; gap: 2px; margin-top: 3px; }
.card .cost i { width: 7px; height: 7px; border-radius: 50%; background: #79c47a; }
.card.sel { transform: translateY(-10px); box-shadow: 0 0 0 3px var(--ink), var(--shadow); }
.card.dragging { opacity: 0.35; }
.go { flex: 0 0 auto; width: 76px; height: 76px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 30px; box-shadow: var(--shadow); display: grid; place-items: center; }
.go:disabled { opacity: 0.4; }
.pulse { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08); box-shadow: 0 0 0 10px rgb(24 48 40 / 0.12), var(--shadow); } }
.ghost { position: fixed; z-index: 30; pointer-events: none; font-size: 40px; transform: translate(-50%, -60%) scale(1.1); filter: drop-shadow(0 6px 8px rgb(0 0 0 / 0.25)); }

.timebar { background: var(--panel); border-radius: 20px; box-shadow: var(--shadow); padding: 8px 10px; display: flex; gap: 10px; align-items: center; width: min(560px, 100%); }
.tbtn { width: 44px; height: 44px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px var(--line); font-size: 18px; display: grid; place-items: center; flex: 0 0 auto; }
.tbtn.on { background: var(--ink); color: #fff; }
.track { flex: 1; display: grid; gap: 4px; min-width: 0; }
.years { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.yr { height: 14px; border-radius: 7px; background: #e3eae6; overflow: hidden; position: relative; }
.yr i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #9ccc6a, #7fb956 33%, #e0a24a 66%, #b9c9d6); }
.trow { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.trow b { color: var(--ink); font-size: 14px; }
input.scrub { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: ew-resize; }
.track-wrap { position: relative; }

/* floating pops */
.pop { position: fixed; z-index: 20; pointer-events: none; font: 800 18px var(--font-display); background: #fff; border-radius: 999px; padding: 4px 10px; box-shadow: var(--shadow); transform: translate(-50%, -50%); animation: rise 1.6s ease-out forwards; white-space: nowrap; }
.pop.bad { color: var(--bad); } .pop.good { color: var(--good); }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -20%) scale(0.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -260%) scale(1); } }
.shake { animation: shake 0.35s; }
@keyframes shake { 25% { transform: translate(calc(-50% - 6px), -100%); } 75% { transform: translate(calc(-50% + 6px), -100%); } }

/* sheets */
.sheet { position: fixed; z-index: 40; inset: 0; display: grid; place-items: end center; background: rgb(20 40 34 / 0.35); padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet > div { width: min(520px, 100%); max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); overflow: auto; background: #fff; border-radius: 22px; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 14px; animation: up 0.25s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet h2 { margin: 0; font: 800 22px/1.15 var(--font-display); text-wrap: balance; }
.sheet .sub { color: var(--muted); font-size: 13.5px; font-weight: 500; }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.res > div { border-radius: 16px; padding: 12px; display: grid; gap: 6px; justify-items: center; background: #f3f7f4; }
.res .id { font: 800 15px var(--font-display); }
.stars { font-size: 30px; letter-spacing: 2px; }
.stars .off { filter: grayscale(1); opacity: 0.25; }
.stars span { display: inline-block; animation: starpop 0.4s backwards; }
@keyframes starpop { from { transform: scale(0); } 70% { transform: scale(1.3); } }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1; min-width: 120px; height: 50px; border-radius: 14px; background: #eef3f0; font-size: 15px; font-weight: 700; }
.btn.primary { background: var(--ink); color: #fff; }
.strats { display: flex; gap: 6px; align-items: center; justify-content: center; font-size: 13px; color: var(--muted); }
.strats i { width: 22px; height: 22px; border-radius: 6px; background: #e3eae6; display: grid; place-items: center; font-style: normal; font-size: 13px; }
.strats i.found { background: var(--gold); }
.dcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.dcard { perspective: 600px; height: 150px; }
.dcard .in { position: relative; width: 100%; height: 100%; transition: transform 0.5s; transform-style: preserve-3d; }
.dcard.flip .in { transform: rotateY(180deg); }
.dcard .f, .dcard .bk { position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden; padding: 10px; display: grid; align-content: center; justify-items: center; gap: 4px; text-align: center; }
.dcard .f { background: linear-gradient(160deg, #fff6d8, #ffe7a3); box-shadow: inset 0 0 0 2px #f1c95a; }
.dcard .f .ic { font-size: 40px; }
.dcard .f b { font: 800 15px var(--font-display); }
.dcard .f small { font-weight: 500; font-size: 12px; color: var(--muted); }
.dcard .bk { background: #183028; color: #e8f2ec; transform: rotateY(180deg); font-size: 12.5px; font-weight: 500; }
.dcard .bk b { color: #ffe08a; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.dcard.locked .f { background: #eef2ef; box-shadow: inset 0 0 0 2px #dbe3de; }
.dcard.locked .f .ic { filter: grayscale(1) brightness(1.6); opacity: 0.35; }
.dcard.new .f { animation: glow 1.4s ease-in-out 3; }
@keyframes glow { 50% { box-shadow: inset 0 0 0 2px #f1c95a, 0 0 0 6px rgb(245 184 0 / 0.35); } }
.levels { display: grid; gap: 10px; }
.lvl { display: flex; gap: 12px; align-items: center; text-align: left; background: #f3f7f4; border-radius: 16px; padding: 12px; }
.lvl .n { width: 48px; height: 48px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font: 800 20px var(--font-display); flex: 0 0 auto; }
.lvl[disabled] { opacity: 0.5; cursor: not-allowed; }
.lvl .t { font: 800 16px var(--font-display); }
.lvl .s { font-size: 13px; color: var(--muted); }

/* why bubble */
.why > div { gap: 10px; }
.why .head { display: flex; gap: 12px; align-items: center; }
.why .big { font: 800 34px var(--font-display); }
.why .ic { font-size: 40px; }
.cause { display: grid; grid-template-columns: 30px 1fr; gap: 2px 8px; align-items: center; }
.cause .ci { font-size: 22px; grid-row: span 2; }
.cause .bar { height: 10px; border-radius: 5px; background: #e6ece8; overflow: hidden; }
.cause .bar i { display: block; height: 100%; background: var(--ink); border-radius: 5px; }
.cause.lead .bar i { background: var(--bad); }
.cause .lb { font-size: 13.5px; }
.cause .dt { grid-column: 2; font-size: 12px; font-weight: 500; color: var(--muted); }

.hand { position: fixed; z-index: 35; font-size: 38px; pointer-events: none; transform: translate(-30%, -10%); filter: drop-shadow(0 4px 6px rgb(0 0 0 / 0.3)); }
.hud:has(~ .title:not([hidden])) { visibility: hidden; }
.title { position: fixed; z-index: 45; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, rgb(207 233 223 / 0.55), rgb(207 233 223 / 0.97) 70%); padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.title > div { display: grid; gap: 14px; justify-items: center; text-align: center; }
.title h1 { margin: 0; font: 800 clamp(44px, 12vw, 84px)/0.95 var(--font-display); letter-spacing: -0.02em; color: var(--ink); }
.title p { margin: 0; font-size: 16px; color: var(--muted); max-width: 30ch; }
.title .btn { min-width: 200px; flex: 0; font-size: 18px; height: 58px; }
@media (max-width: 520px) {
  .card { width: 56px; height: 80px; border-radius: 12px; padding: 6px 2px 5px; }
  .card .ic { font-size: 26px; }
  .card .nm { font-size: 10px; }
  .cards { gap: 6px; padding-inline: 0; }
  .tray { position: relative; }
  .go { position: absolute; right: 0; bottom: calc(100% + 6px); width: 60px; height: 60px; font-size: 24px; }
  .goalbar { display: none; }
  .chip { min-width: 38px; padding: 3px 5px; }
  .chip .ic { font-size: 15px; }
  .chip .v { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="world" aria-label="Hai hòn đảo ao: thế giới A và B"></canvas>
<div class="hud">
  <div class="top">
    <button class="pill level" id="levelBtn" aria-label="Chọn màn"></button>
    <div class="pill goalbar" id="goalbar" aria-label="Mục tiêu"></div>
    <span class="spacer"></span>
    <button class="pill round" id="bookBtn" aria-label="Sổ khám phá">📖<span class="badge" id="bookBadge" hidden></span></button>
    <button class="pill round" id="muteBtn" aria-label="Âm thanh">🔊</button>
  </div>
  <div id="tags"></div>
  <div class="drop" id="drop"></div>
  <div class="bottom">
    <div class="hint" id="hint" hidden></div>
    <div class="tray" id="tray">
      <div class="cards" id="cards"></div>
      <button class="go" id="go" aria-label="Chạy 5 năm">▶</button>
    </div>
    <div class="timebar" id="timebar" hidden>
      <button class="tbtn" id="edit" aria-label="Đổi kế hoạch">✏️</button>
      <div class="track">
        <div class="trow"><b id="when">Năm 1</b><span id="season">🌸</span></div>
        <div class="track-wrap">
          <div class="years" id="years"></div>
          <input class="scrub" type="range" id="scrub" min="0" max="20" step="0.05" value="0" aria-label="Thời gian">
        </div>
      </div>
      <button class="tbtn" id="fast" aria-label="Tua nhanh">⏩</button>
      <button class="tbtn on" id="pause" aria-label="Tạm dừng">❚❚</button>
    </div>
  </div>
</div>
<div class="sheet" id="sheet" hidden><div id="sheetBody"></div></div>
<div class="title" id="titleScreen">
  <div>
    <h1>WILDROOT</h1>
    <p>Cùng một cái ao. Hai lựa chọn. Xem chúng khác nhau thế nào.</p>
    <button class="btn primary" id="start">Chơi</button>
  </div>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
